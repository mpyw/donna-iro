[package]
name = "donna-iro"
version = "0.1.0"
edition = "2021"

[features]
default = ["whisper"]
# whisper.cpp のビルドに数分かかるので切り離してある。
#   cargo run --no-default-features   → キーボード入力（再生の確認用、すぐ起動する）
#   cargo run                         → マイク入力
whisper = ["dep:whisper-rs"]
# 音源をバイナリに埋め込む。ラズパイに1ファイル置くだけで動く。
# include_bytes! はコンパイル時にファイルを要求するので、
# assets/*.wav が揃うまでは有効にできない。
embed = []
# Mac の GPU / Neural Engine を使う。認識が数倍速くなる。
#   cargo build --release --features metal
metal = ["whisper-rs?/metal"]
coreml = ["whisper-rs?/coreml"]

[dependencies]
anyhow = "1"
rand = "0.8"

# 録音 / 再生。どちらもクロスプラットフォームで、macOS では CoreAudio、
# Raspberry Pi では ALSA を使う。ソースは共通のままでよい。
cpal = "0.15"
rodio = "0.19"

# 音声認識: whisper.cpp の Rust バインディング
whisper-rs = { version = "0.16", optional = true, features = ["log_backend"] }
